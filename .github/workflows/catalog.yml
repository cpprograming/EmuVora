name: Refresh official emulator catalog
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official assets and pin SHA-256 hashes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Refresh-Catalog.ps1
      - name: Save verified catalog
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/packages.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Refresh official emulator package catalog"
            git push
          }
