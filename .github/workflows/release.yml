name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/EmuVora.App/EmuVora.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath EmuVora-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: EmuVora-win-x64.zip
